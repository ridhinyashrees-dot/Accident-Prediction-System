<!DOCTYPE html>
<html>

<head>
    <title>Accident Data Entry</title>

    <!-- SweetAlert for popup -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Confetti animation -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

    <style>
        body {
            margin:0;
            font-family: Arial;
            color: white;
            text-align: center;
            background: url("https://images.unsplash.com/photo-1536099629323-44806c1ea264")no-repeat center center/cover;
            display: flex;
           flex-direction: column;
           justify-content: center;
           align-items: center;
        }
        
        body::before {
           content: "";
           position: fixed;
           top: 0;
           left: 0;
           width: 100%;
           height: 100%;
           background: rgba(0, 0, 0, 0.55);
           z-index: -1;
        }
        
        h1 {
    margin-top: 30px;
    font-size: 32px;
}

        

        .form-box {
         background: white;
         color: black;
         width: 450px;   /* increased size */
         padding: 30px;  /* more space inside */
         margin: 20px auto;
         border-radius: 15px;
         max-height: 90vh;
        }

        .form-box {
    box-shadow: 0px 10px 30px rgba(0,0,0,0.3);
}


        select, input {
         width: 100%;
         padding: 8px;
         margin: 8px 0;
         border-radius: 5px;
         font-size: 16px;
        }


        button {
    width: 100%;
    padding: 12px;
    background: linear-gradient(45deg, #2a5298, #1e3c72);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.05);
}


        a {
            color: rgb(182, 62, 152);
            display: block;
            margin-top: 15px;
        }
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

       .spinner {
           border: 6px solid #f3f3f3;
           border-top: 6px solid lch(26.85% 99.9 304.33);
           border-radius: 50%;
           width: 50px;
           height: 50px;
           animation: spin 1s linear infinite;
        }

        @keyframes spin {
           0% { transform: rotate(0deg); }
           100% { transform: rotate(360deg); }
        }

    </style>
</head>

<body>

<h1>🚗 Enter Accident Data</h1>
<div class="container"></div>
    <div class="form-box">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit">Submit Data</button>
        </form>

        <a href="/home/">Go to Dashboard</a>
    </div>
</div>

<div id="loader" style="display:none;">
    <div class="spinner"></div>
    <p>Submitting...</p>
</div>


<!-- Popup + Celebration -->
{% if messages %}
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>
    {% for message in messages %}
        Swal.fire({
            title: '🎉 Success!🚗 Accident Recorded!',
            html:'<b>❤️You have contributed to save lives❤️</b><b>🎊Keep Going🎊</b>',
            icon: 'success',
            background:'#e1cbe5',
            confirmButtonText: 'OK',
            showClass: {popup: 'animate__animated animate__zoomIn'},
            hideClass: {popup: 'animate__animated animate__fadeOut'}
        }).then((result) => {
            if (result.isConfirmed) {
                window.location.href = "{% url 'home' %}";  // dashboard URL
            }
        });

        confetti({
            particleCount: 150,
            spread: 80,
            origin: { y: 0.6 }
        });
    {% endfor %}
</script>
{% endif %}

<script>
    const form = document.querySelector("form");
    const loader = document.getElementById("loader");

    form.addEventListener("submit", function () {
        loader.style.display = "flex";  // show spinner

        const button = form.querySelector("button");
        button.innerText = "Submitting...";
        button.disabled = true;         // prevent multiple clicks
    });
</script>


</body>

</html>
